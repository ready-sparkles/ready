  <text x="72" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="720" fill="#202124">Your free Ready account starts in Calendar</text>
  <text x="72" y="160" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#5F6368">First use creates or reuses the account automatically—no separate signup or browser login.</text>

